<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif"><title>Golden Y24a</title><rect width="1000" height="600" fill="#F8FAFC"/><g data-elemento-id="a1" transform="translate(40 40)"><path d="M0,0 L220,0 L220,120 L0,120 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="110" y="26" font-size="16" font-weight="400" text-anchor="middle" fill="#0F172A">Este es un texto bastante</text><text x="110" y="46" font-size="16" font-weight="400" text-anchor="middle" fill="#0F172A">largo que tiene que</text><text x="110" y="66" font-size="16" font-weight="400" text-anchor="middle" fill="#0F172A">partirse en varias líneas</text><text x="110" y="86" font-size="16" font-weight="400" text-anchor="middle" fill="#0F172A">dentro de la forma para</text><text x="110" y="106" font-size="16" font-weight="400" text-anchor="middle" fill="#0F172A">que se vea el ajuste</text></g><g data-elemento-id="a2" transform="translate(300 40)"><path d="M0,0 L220,0 L220,120 L0,120 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="4" y="20" font-size="16" font-weight="400" text-anchor="start" fill="#0F172A">Primera línea</text><text x="4" y="40" font-size="16" font-weight="400" text-anchor="start" fill="#0F172A">Segunda línea</text><text x="4" y="80" font-size="16" font-weight="400" text-anchor="start" fill="#0F172A">Cuarta tras un hueco</text></g><g data-elemento-id="a3" transform="translate(560 40)"><path d="M0,70 A100,70 0 1 0 200,70 A100,70 0 1 0 0,70 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="100" y="57.75" font-size="14" font-weight="700" text-anchor="middle" fill="#0F172A" font-style="italic" text-decoration="underline">Elipse con texto</text><text x="100" y="75.25" font-size="14" font-weight="700" text-anchor="middle" fill="#0F172A" font-style="italic" text-decoration="underline">en negrita y</text><text x="100" y="92.75" font-size="14" font-weight="700" text-anchor="middle" fill="#0F172A" font-style="italic" text-decoration="underline">cursiva</text></g><g data-elemento-id="a4" transform="translate(800 40)"><path d="M0,0 L120,0 L120,50 L0,50 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="60" y="8" font-size="8" font-weight="400" text-anchor="middle" fill="#0F172A">Este es un texto bastante</text><text x="60" y="18" font-size="8" font-weight="400" text-anchor="middle" fill="#0F172A">largo que tiene que partirse</text><text x="60" y="28" font-size="8" font-weight="400" text-anchor="middle" fill="#0F172A">en varias líneas dentro de</text><text x="60" y="38" font-size="8" font-weight="400" text-anchor="middle" fill="#0F172A">la forma para que se vea el</text><text x="60" y="48" font-size="8" font-weight="400" text-anchor="middle" fill="#0F172A">ajuste</text></g><g data-elemento-id="a5" transform="translate(40 220)"><path d="M0,0 L110,0 L110,60 L0,60 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="55" y="28" font-size="8" font-weight="400" text-anchor="middle" fill="#0F172A">Supercalifragilisticoespi</text><text x="55" y="38" font-size="8" font-weight="400" text-anchor="middle" fill="#0F172A">alidosoextraordinario</text></g><g data-elemento-id="a6" transform="translate(200 220)"><path d="M80,0 L160,60 L80,120 L0,60 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="116" y="62" font-size="16" font-weight="400" text-anchor="end" fill="#0F172A">Rombo con</text><text x="116" y="82" font-size="16" font-weight="400" text-anchor="end" fill="#0F172A">texto</text></g><g data-elemento-id="a7" transform="translate(400 220)"><path d="M0,0 L260,0 L260,90 L0,90 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="256" y="17.75" font-size="10.5" font-weight="400" text-anchor="end" fill="#0F172A">Uno</text><text x="256" y="30.88" font-size="10.5" font-weight="400" text-anchor="end" fill="#0F172A">Dos</text><text x="256" y="44" font-size="10.5" font-weight="400" text-anchor="end" fill="#0F172A">Tres</text><text x="256" y="57.13" font-size="10.5" font-weight="400" text-anchor="end" fill="#0F172A">Cuatro</text><text x="256" y="70.25" font-size="10.5" font-weight="400" text-anchor="end" fill="#0F172A">Cinco</text><text x="256" y="83.38" font-size="10.5" font-weight="400" text-anchor="end" fill="#0F172A">Seis</text></g><g data-elemento-id="a8" transform="translate(700 220)"><path d="M0,13 A80,13 0 0 1 160,13 L160,117 A80,13 0 0 1 0,117 Z M0,13 A80,13 0 1 0 160,13 A80,13 0 1 0 0,13 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="80" y="57.5" font-size="16" font-weight="400" text-anchor="middle" fill="#0F172A">Texto en cilindro</text><text x="80" y="77.5" font-size="16" font-weight="400" text-anchor="middle" fill="#0F172A">con varias palabras</text><text x="80" y="97.5" font-size="16" font-weight="400" text-anchor="middle" fill="#0F172A">que no caben</text></g><g data-elemento-id="t1" transform="translate(40 400)"><text x="4" y="22" font-size="18" font-weight="400" text-anchor="start" fill="#0F172A">Texto libre con un párrafo largo</text><text x="4" y="44.5" font-size="18" font-weight="400" text-anchor="start" fill="#0F172A">que se sale del cuadro porque no</text><text x="4" y="67" font-size="18" font-weight="400" text-anchor="start" fill="#0F172A">se reduce ni crece</text><text x="4" y="89.5" font-size="18" font-weight="400" text-anchor="start" fill="#0F172A">Y un segundo párrafo</text></g><g data-elemento-id="t2" transform="translate(400 400) rotate(15 130 40)"><rect x="0" y="0" width="260" height="80" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linejoin="round"/><text x="130" y="36" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">Texto girado</text><text x="130" y="56" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">con dos líneas</text></g><g data-elemento-id="l1"><path d="M150,160 L150,190 L280,190 L280,220" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="280,220 274,208 286,208" fill="#2563EB"/><rect x="95.8" y="181" width="238.4" height="18" rx="9" fill="#F8FAFC" stroke="none"/><text x="215" y="193" font-size="8" font-weight="400" text-anchor="middle" fill="#0F172A">etiqueta del conector que es larga</text></g></svg>
