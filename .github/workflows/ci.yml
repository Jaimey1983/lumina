name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.25.0"

jobs:
  packages:
    name: Packages (build + test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumina/scoring build
      - run: pnpm --filter @lumina/scoring test
      - run: pnpm --filter @lumina/scoring lint
      - run: pnpm --filter @lumina/element-kit-core build
      - run: pnpm --filter @lumina/element-kit-core test
      - run: pnpm --filter @lumina/element-kit-core lint
      - run: pnpm --filter @lumina/element-kit build
      - run: pnpm --filter @lumina/element-kit test
      - run: pnpm --filter @lumina/element-kit lint

  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      JWT_SECRET: "ci-only-secret-not-for-production"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lumina-backend exec prisma generate
      - run: pnpm --filter lumina-backend lint
      - run: pnpm --filter lumina-backend test
      - run: pnpm --filter lumina-backend build

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lumina-frontend lint
      - run: pnpm --filter lumina-frontend test:unit
      - run: pnpm --filter lumina-frontend build

