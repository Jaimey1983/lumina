packages:
  - 'packages/*'
  - 'lumina-frontend'
  - 'lumina-backend'

overrides:
  '@types/pg': 8.11.11
  lodash: '>=4.18.0'
  systeminformation: '>=5.31.6'
  tmp: '>=0.2.6'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  follow-redirects: '>=1.16.0'
  postcss: '>=8.5.10'
  brace-expansion@1: '>=1.1.13'
  brace-expansion@5: '>=5.0.6'
  minimatch@3>brace-expansion: '1.1.13'
  minimatch@10>brace-expansion: '>=5.0.6'

allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': true
  prisma: true
  unrs-resolver: false
  cypress: false
  sharp: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
