packages:
  - 'packages/*'
  - 'lumina-frontend'
  - 'lumina-backend'

# E7.6 (vía C): `@lumina/element-kit` depende de `lumina-frontend` (workspace:*)
# porque sus adapters envuelven componentes que viven en el frontend (37 subpaths
# + shims). La inversión total (mover los componentes al kit) es un esfuerzo
# futuro; el borde se acepta como excepción estructural. Esto permite que
# `pnpm -r <script>` corra pese al ciclo de tareas (CI usa `pnpm --filter` en
# orden explícito de todos modos).
ignoreWorkspaceCycles: true

overrides:
  '@types/pg': 8.11.11
  lodash: '>=4.18.0'
  systeminformation: '>=5.31.6'
  tmp: '>=0.2.6'
  ws: '>=8.20.1'
  qs: '>=6.15.2'
  follow-redirects: '>=1.16.0'
  postcss: '>=8.5.10'
  brace-expansion@1: '>=1.1.13'
  brace-expansion@5: '>=5.0.6'
  minimatch@3>brace-expansion: '1.1.13'
  minimatch@10>brace-expansion: '>=5.0.6'

allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': true
  prisma: true
  unrs-resolver: false
  cypress: false
  sharp: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
